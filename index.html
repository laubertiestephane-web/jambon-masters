<style>
/* Layout : app mobile à onglets fixes en bas, cartes larges, affiche "Jambon Masters" en tête. */
:root{
  --bg:#FAF5F6; --surface:#FFFFFF; --surface2:#F3E9EC; --fg:#1B1F2E; --muted:#6B6672;
  --pink:#E3146B; --pink-soft:#FBD5E3; --navy:#14213D; --navy-ink:#14213D; --line:#E6D9DE;
  --ok:#2E8B57; --warn:#D98A1E; --teamA:#EA2839; --teamB:#1A206D; --on-navy:#FFFFFF;
  --display:'Alfa Slab One', 'Rockwell', serif; --body:'Nunito Sans', system-ui, -apple-system, sans-serif;
  --r:16px; --shadow:0 6px 20px rgba(20,33,61,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1628; --surface:#182036; --surface2:#1F2A45; --fg:#F2EEF0; --muted:#A7A2B0; --pink:#F2478E; --pink-soft:#3A1F2C;
  --navy:#E9EEF8; --navy-ink:#0F1628; --on-navy:#0F1628; --line:#2B3552; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1628; --surface:#182036; --surface2:#1F2A45; --fg:#F2EEF0; --muted:#A7A2B0; --pink:#F2478E; --pink-soft:#3A1F2C;
  --navy:#E9EEF8; --navy-ink:#0F1628; --on-navy:#0F1628; --line:#2B3552; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--pink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:10px;min-width:0}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:.85rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--surface2);font-weight:700;text-decoration:none;color:var(--fg);min-height:44px}
.btn.primary{background:var(--pink);color:#fff}
.btn.ghost{border:1px solid var(--line);background:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* Header */
.hero{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding-block:6px 14px}

.hero h1{font-size:1.55rem;line-height:1.05;color:var(--navy)}
.hero .sub{color:var(--pink);font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(48px,1fr);overflow-x:auto}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 1px 6px;font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--pink)}
section[role="tabpanel"]{display:grid;gap:14px}

/* Scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.score .team{display:grid;gap:4px}
.score .name{font-weight:800;font-size:.95rem}
.score .pts{font-family:var(--display);font-size:2.6rem;line-height:1}
.score .vs{font-family:var(--display);color:var(--muted);font-size:1rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}

/* Day photo */
.photo{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);gap:6px;padding:16px}
.photo .edit{position:absolute;right:10px;bottom:10px;background:rgba(20,33,61,.75);color:#fff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:.85rem;display:flex;gap:6px;align-items:center}
.photo .edit svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
.photo.small{aspect-ratio:16/9}

/* Days list */
.day{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.day .d{display:grid;text-align:center;background:var(--surface2);border-radius:12px;padding:6px 0}
.day .d b{font-family:var(--display);font-size:1.3rem;line-height:1}
.day .d span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.res{font-weight:800;font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.res.A{background:var(--teamA);color:#fff}.res.B{background:var(--teamB);color:#fff}.res.draw{background:var(--warn);color:#fff}

/* Courses */
.course{padding:0;overflow:hidden}
.course .art{aspect-ratio:400/220;max-width:100%;background:var(--surface2)}
.course .art svg{width:100%;height:100%;display:block}
.course .body{padding:14px 16px 16px;display:grid;gap:10px}
.course .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.course .meta div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.course .meta b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.course ul{margin:0;padding-left:18px;display:grid;gap:4px}
.course .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.playdates{display:flex;gap:6px;flex-wrap:wrap}

/* Welcome */
.welcome{background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:16px;display:grid;gap:4px;box-shadow:var(--shadow)}
.welcome h2{color:var(--pink);font-size:1.7rem}
.welcome .change{font-size:.8rem;color:var(--on-navy);opacity:.8;text-decoration:underline;justify-self:start}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick button{padding:12px 8px;border-radius:12px;background:var(--surface2);font-weight:800;display:grid;gap:2px;text-align:center}
.pick button span{font-size:.75rem;color:var(--muted);font-weight:600}
/* Mur */
.post{padding:0;overflow:hidden}
.post img{width:100%;max-height:70vh;object-fit:cover;display:block;background:var(--surface2)}
.post .cap{padding:12px 16px;display:grid;gap:4px}
.post .who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.post .who b{color:var(--fg)}
.wallday{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.wallday h3{font-size:1.3rem}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--pink);color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.fab svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.preview{width:100%;max-height:40vh;object-fit:contain;border-radius:12px;background:var(--surface2)}
/* People */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.person{display:grid;justify-items:center;gap:6px;text-align:center;padding:14px 10px;position:relative}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-content:center;font-family:var(--display);font-size:1.4rem;color:var(--pink);border:3px solid var(--line)}
.person.A .avatar{border-color:var(--teamA)}.person.B .avatar{border-color:var(--teamB)}
.person .nick{font-weight:800}
.person .nm{font-size:.85rem;color:var(--muted)}
.person .tm{position:absolute;top:10px;right:10px}
.person .ph{font-size:.8rem}

/* Expenses */
.bal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.bal .v{font-weight:800}
.pos{color:var(--ok)}.neg{color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:.85rem;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.chip.A[aria-pressed="true"]{background:var(--teamA);border-color:var(--teamA)}
.chip.B[aria-pressed="true"]{background:var(--teamB);border-color:var(--teamB)}
.exp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp .amt{font-weight:800}
.field{display:grid;gap:4px}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

/* Admin */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{padding:8px 4px;border-radius:9px;font-weight:800;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button.A[aria-pressed="true"]{background:var(--teamA);color:#fff}.seg button.B[aria-pressed="true"]{background:var(--teamB);color:#fff}.seg button.draw[aria-pressed="true"]{background:var(--warn);color:#fff}
.adm-day{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.adm-day:first-child{border-top:0}
.adm-day .t{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;box-shadow:var(--shadow);transition:opacity .3s}
.toast[hidden]{display:none}
.notice{background:var(--pink-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.countdown{font-family:var(--display);font-size:3.4rem;line-height:1;color:var(--pink)}
.flight{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.flight .t{font-family:var(--display);font-size:1.1rem;white-space:nowrap}
.flight .cities{font-weight:800}
.copy{display:inline-flex;align-items:center;gap:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;align-items:end}
.sheet .in{background:var(--surface);border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:85vh;overflow:auto;display:grid;gap:12px;max-width:720px;margin:0 auto;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Drapeau mauricien : 4 bandes */
.mu{display:inline-grid;grid-template-rows:repeat(4,1fr);width:22px;height:15px;border-radius:3px;overflow:hidden;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.mu i{display:block}.mu i:nth-child(1){background:#EA2839}.mu i:nth-child(2){background:#1A206D}.mu i:nth-child(3){background:#FFD500}.mu i:nth-child(4){background:#00A551}
.flagbar{height:5px;border-radius:3px;background:linear-gradient(90deg,#EA2839 0 25%,#1A206D 25% 50%,#FFD500 50% 75%,#00A551 75%);margin-bottom:12px}
.hero{grid-template-columns:64px 1fr auto}
.me-avatar{width:50px;height:50px;border-radius:50%;padding:0;overflow:hidden;background:var(--surface2);border:2.5px solid var(--pink);display:grid;place-content:center;font-family:var(--display);font-size:1.05rem;color:var(--pink)}
.me-avatar svg,.me-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.greet{font-size:.85rem;color:var(--pink);font-weight:800}
.pighead{width:46px;height:46px;margin:0 auto;display:block}
.matches{display:grid;gap:6px;margin-top:4px}
.match{display:grid;grid-template-columns:18px 1fr 30px 1fr;align-items:center;gap:6px;font-weight:800;font-size:.9rem}
.match .mn{font-family:var(--display);color:var(--muted);font-size:.8rem}
.match .mA{color:var(--teamA);text-align:right}.match .mB{color:var(--teamB)}
.pighead.sm{width:28px;height:28px}
.adm-match{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:4px;align-items:center}
.adm-match select{padding:6px 4px;font-size:.85rem}
.install{background:var(--surface);border:2px dashed var(--pink);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.install .steps{display:grid;gap:6px;font-size:.95rem}
.install .row{flex-wrap:nowrap}
.install .steps div{display:flex;gap:10px;align-items:center}
.install .ico{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:grid;place-content:center;flex:none}
.install .ico svg{width:20px;height:20px;stroke:var(--pink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Tirelire cochon animée */
.piggy{width:96px;height:84px;display:block;margin:0 auto}
.piggy .coin{animation:coinDrop 2.6s ease-in infinite;transform-origin:center}
.piggy .body{animation:pigWiggle 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes coinDrop{0%{transform:translateY(-26px) rotate(0);opacity:0}15%{opacity:1}55%{transform:translateY(2px) rotate(180deg);opacity:1}62%{opacity:0}100%{transform:translateY(2px);opacity:0}}
@keyframes pigWiggle{0%,50%{transform:scale(1)}58%{transform:scale(1.06,.94)}66%{transform:scale(.97,1.04)}74%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.piggy .coin,.piggy .body{animation:none}}
.fxcard{border:2px solid var(--pink);background:linear-gradient(180deg,var(--pink-soft),var(--surface) 55%)}
.fxcard h2{color:var(--pink);text-align:center}
.fxcard input{font-size:1.25rem;font-weight:800;text-align:center;border-color:var(--pink)}
.moneyhead{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
/* Live leaderboard (style Ryder Cup) */
.lb-head{display:grid;grid-template-columns:1fr auto 1fr;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.lb-head .side{padding:14px 10px;display:grid;gap:2px;text-align:center;color:#fff}
.lb-head .side.A{background:var(--teamA)}.lb-head .side.B{background:var(--teamB)}
.lb-head .side .nm{font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.lb-head .side .big{font-family:var(--display);font-size:2.6rem;line-height:1}
.lb-head .mid{background:var(--navy);color:var(--navy-ink);display:grid;place-content:center;padding:0 12px;text-align:center}
.lb-head .mid .pighead{width:36px;height:36px;margin:0 auto}
.lb-head .mid small{font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.lb-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden;width:100%;text-align:left}
.lb-row .pair{display:grid;gap:2px;font-weight:800;font-size:.95rem;min-width:0}
.lb-row .pair span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .pair.A{color:var(--teamA)}.lb-row .pair.B{color:var(--teamB);text-align:right}
.lb-row .st{display:grid;justify-items:center;gap:2px;min-width:74px}
.lb-row .st b{font-family:var(--display);font-size:1.15rem;line-height:1;padding:6px 10px;border-radius:10px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.lb-row .st b.A{background:var(--teamA);color:#fff}.lb-row .st b.B{background:var(--teamB);color:#fff}
.lb-row .st small{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.lb-row .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--surface2)}
.lb-row .bar i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--teamA)}
.lb-row .bar i.B{background:var(--teamB)}
.lb-row.done{opacity:.92}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.holes span{aspect-ratio:1;display:grid;place-content:center;border-radius:6px;font-size:.72rem;font-weight:800;background:var(--surface2);color:var(--muted)}
.holes span.A{background:var(--teamA);color:#fff}.holes span.B{background:var(--teamB);color:#fff}.holes span.H{background:var(--warn);color:#fff}
.holebtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.holebtns button{min-height:64px;border-radius:14px;font-weight:800;font-size:1rem;color:#fff;display:grid;place-content:center;gap:2px}
.holebtns .bA{background:var(--teamA)}.holebtns .bH{background:var(--warn)}.holebtns .bB{background:var(--teamB)}
.holebtns small{font-size:.7rem;opacity:.9;font-weight:700}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daychips .chip{white-space:nowrap}
/* Météo */
.wx{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.wx .ico{width:64px;height:64px}
.wx .t{font-family:var(--display);font-size:2rem;line-height:1}
.wx .row{gap:6px}
.wxday{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.wxday .ico{width:40px;height:40px}

.rank{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px 10px;align-items:center}
.rank .pos{font-family:var(--display);color:var(--muted)}
.rank .pos.top{color:var(--pink)}
.rank .val{font-family:var(--display);font-size:1.15rem}
.rank .thru{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:52px;text-align:right}
.rank .nm b{display:block}.rank .nm small{color:var(--muted)}

.plist .av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--surface);display:grid;place-content:center;font-family:var(--display);font-size:.8rem;color:var(--pink)}

.hrow .hi{font-size:.68rem;color:var(--muted);font-weight:700;line-height:1.1}
.hrow .hi i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-left:2px}
.hrow .v{font-family:var(--display);font-size:1.25rem;text-align:center}
.hrow .v.empty{color:var(--muted);font-size:.9rem}
.hrow button{width:36px;height:36px;border-radius:9px;background:var(--surface);font-weight:900;font-size:1.2rem;box-shadow:var(--shadow)}
.hrow .pts{font-size:.72rem;color:var(--muted);text-align:center;font-weight:800}
.hrow.locked{opacity:.75}.hrow.locked button{background:transparent;box-shadow:none;color:var(--muted);font-size:1rem}
.hrow.under .v{color:var(--ok)}.hrow.over .v{color:var(--pink)}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.ptabs button{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:var(--surface2);font-size:.72rem;line-height:1.1}
.ptabs button[aria-pressed="true"]{background:var(--pink);color:#fff}
.ptabs button[aria-pressed="true"] small{color:#fff;opacity:.9}
.ptabs .av{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--surface);display:grid;place-content:center;font-family:var(--display);font-size:.7rem;color:var(--pink)}
.ptabs .av svg,.ptabs .av img{width:100%;height:100%;object-fit:cover}
.ptabs small{color:var(--muted);font-size:.62rem}
.lb-row .pair b{font-weight:900;color:var(--pink);margin-left:4px}
.prow{display:grid;grid-template-columns:1fr 40px 52px 40px;gap:6px;align-items:center;background:var(--surface2);border-radius:10px;padding:6px 8px;margin-bottom:6px}
.prow .nm{font-weight:800}.prow .nm small{display:block;color:var(--muted);font-weight:600}
.prow button{width:40px;height:40px;border-radius:9px;background:var(--surface);font-weight:900;font-size:1.2rem;box-shadow:var(--shadow)}
.prow .v{font-family:var(--display);font-size:1.3rem;text-align:center}.prow .v.empty{color:var(--muted);font-size:.9rem}
.prow.done{opacity:.85}
.scsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.scsum div{background:var(--surface2);border-radius:10px;padding:6px 4px}
.scsum b{display:block;font-family:var(--display);font-size:1.1rem}
.scsum small{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.adminlink{display:block;text-align:center;color:var(--muted);font-size:.75rem;margin-top:18px;text-decoration:underline;background:none}
</style>
</head>

// ---------- Météo (Open-Meteo, sans clé) ----------
const WX_TXT = c => c===0?"Grand soleil":c<=2?"Soleil voilé":c===3?"Nuageux":c<=48?"Brouillard":c<=57?"Bruine":c<=67?"Pluie":c<=77?"Neige (!)":c<=82?"Averses":"Orage";
function wxIcon(code, size=64){ // cochon + soleil / nuage / pluie
  const sun=`<circle cx="22" cy="20" r="10" fill="#FFD500"/><g stroke="#FFD500" stroke-width="2.5" stroke-linecap="round"><path d="M22 4v4M22 32v4M6 20h4M34 20h4M10 8l3 3M31 29l3 3M34 8l-3 3M13 29l-3 3"/></g>`;
  const cloud=`<path d="M14 38 h30 a8 8 0 0 0 0 -16 a11 11 0 0 0 -21 -3 a8 8 0 0 0 -9 19z" fill="#D9DEE8" stroke="#B8C0CF" stroke-width="1.5"/>`;
  const rain=`<g stroke="#4A9CCB" stroke-width="2.5" stroke-linecap="round"><path d="M20 42l-3 7M30 42l-3 7M40 42l-3 7"/></g>`;
  const bolt=`<path d="M30 40l-6 10h5l-3 9 9-12h-5l3-7z" fill="#FFD500"/>`;
  const umbrella=`<path d="M38 44 a14 14 0 0 1 28 0z" fill="#E3146B"/><path d="M52 44v14a3 3 0 0 0 6 0" stroke="#7A1F3E" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  let sky = code===0 ? sun : code<=2 ? sun+cloud : code===3||code<=48 ? cloud : code>=95 ? cloud+bolt : cloud+rain;
  const pig=`<g transform="translate(34 40) scale(.75)">${PIG_HEAD.replace(/<svg[^>]*>|<\/svg>/g,"")}</g>`;
  return `<svg class="ico" viewBox="0 0 80 80" style="width:${size}px;height:${size}px" aria-hidden="true">${sky}${pig}${code>=51&&code<95?umbrella:""}</svg>`;
}
async function loadWeather(key){ const g=GEO[key]; if(!g || S.wx[key]) return; try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lon}&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Africa%2FJohannesburg&forecast_days=10`;
  const r=await fetch(u); const j=await r.json(); if(j && j.daily){ S.wx[key]=j; if(S.tab==="home") render(); } }catch(e){ console.warn("wx",e); } }
function wxAt(j, dayId, hour){ if(!j||!j.hourly) return null; const i=j.hourly.time.indexOf(dayId+"T"+String(hour).padStart(2,"0")+":00"); if(i<0) return null; return {t:j.hourly.temperature_2m[i], rain:j.hourly.precipitation_probability[i], wind:j.hourly.wind_speed_10m[i], code:j.hourly.weather_code[i]}; }
function wxDay(j, dayId){ if(!j||!j.daily) return null; const i=j.daily.time.indexOf(dayId); if(i<0) return null; return {max:j.daily.temperature_2m_max[i], min:j.daily.temperature_2m_min[i], rain:j.daily.precipitation_probability_max[i], wind:j.daily.wind_speed_10m_max[i], code:j.daily.weather_code[i]}; }
function teeHour(d){ const m=(d.teeTime||"").match(/(\d{1,2})\s*[h:]/); return m?+m[1]:13; }
function weatherCard(){
  const t=todayId(); const inTrip = t>=TRIP_START && t<=TRIP_END;
  const golf=golfDays(); const next = golf.find(d=>d.id>=t); // golf du jour ou prochain
  const townKey = "knysnaTown"; loadWeather(townKey); if(next) loadWeather(next.course);
  const jt=S.wx[townKey]; if(!jt) return "";
  const cur=jt.current||{}; const today=wxDay(jt,t);
  let html=`<div class="card"><div class="eyebrow">Météo${inTrip?" · Knysna":" · Knysna, en ce moment"}</div>
    <div class="wx">${wxIcon(cur.weather_code??(today?.code??3))}<div><span class="t num">${Math.round(cur.temperature_2m??today?.max??0)}°</span> <span class="muted">${WX_TXT(cur.weather_code??(today?.code??3))}</span><br><span class="small muted num">${today?`${Math.round(today.min)}° / ${Math.round(today.max)}° · pluie ${today.rain}% · vent max ${Math.round(today.wind)} km/h`:""}</span></div></div>`;
  if(next){ const jc=S.wx[next.course]; const h=teeHour(next); const w=jc?wxAt(jc,next.id,h):null; const dd=jc?wxDay(jc,next.id):null; const p=dparts(next.id);
    if(w||dd){ const c=COURSES[next.course]; html+=`<div class="wxday">${wxIcon((w||dd).code,40)}<div><b>${next.id===t?"Aujourd'hui":p.dow+" "+p.d+" "+p.mon} · ${esc(c.short)}</b><br><span class="small muted">${w?`à ${h}h : ${Math.round(w.t)}° · vent ${Math.round(w.wind)} km/h · pluie ${w.rain}%`:`${Math.round(dd.min)}° / ${Math.round(dd.max)}° · pluie ${dd.rain}% · vent ${Math.round(dd.wind)} km/h`}</span></div><span class="small muted">${WX_TXT((w||dd).code)}</span></div>`; }
    else if(jc){ html+=`<p class="muted small" style="margin-top:8px">Prévision pour ${COURSES[next.course].short} disponible à partir de J-10.</p>`; } }
  html+=`<p class="muted small" style="margin-top:6px">Source : Open-Meteo, heure locale d'Afrique du Sud.</p></div>`;
  return html;
}

// ---------- Live (match play trou par trou) ----------
function golfDays(){ return S.days.filter(d=>COURSES[d.course]); }
function defaultLiveDay(){ const t=todayId(); const gd=golfDays(); return (gd.find(d=>d.id===t)||gd.find(d=>d.id>t)||gd[gd.length-1]||{}).id||""; }
function matchState(holes){ // holes: ["A","B","H",...]
  let a=0,b=0; holes.forEach(h=>{ if(h==="A")a++; else if(h==="B")b++; });
  const played=holes.length, diff=a-b, remaining=18-played, lead=Math.abs(diff);
  const closed = played>=18 || lead>remaining;
  let label, cls="";
  if(closed){ if(diff===0) label="½ · AS"; else { cls=diff>0?"A":"B"; label = played>=18 ? (lead+" UP") : (lead+"&"+remaining); } }
  else { if(diff===0) label="AS"; else { cls=diff>0?"A":"B"; label=lead+" UP"; } }
  return {a,b,diff,played,remaining,closed,label,cls, winner: closed?(diff>0?"A":diff<0?"B":"H"):""};
}
function liveFor(dayId){ const L=S.live[dayId]||{}; return {m:[0,1,2].map(i=>(L.m&&L.m[i])||{holes:[]})}; }
function pairNames(ids){ return (ids||[]).filter(Boolean).map(id=>{const p=playerById(id); return p?esc(p.nick):"?";}); }
function renderLive(){
  const gd=golfDays(); if(!S.liveDay || !gd.some(d=>d.id===S.liveDay)) S.liveDay=defaultLiveDay();
  const d=S.days.find(x=>x.id===S.liveDay); const can=!!S.uid && !!S.db;
  if(!d||!CARDS[d.course]){ $("#p-live").innerHTML=`<div class="card"><p class="muted">Aucune journée de golf.</p></div>`; return; }
  const matches=validMatches(d); const isFinal = d.id===lastGolfDay();
  const c=COURSES[d.course]; const p=dparts(d.id);
  const chips=`<div class="daychips">${gd.map(x=>`<button class="chip" data-lday="${x.id}" aria-pressed="${x.id===d.id}">${dparts(x.id).dow} ${dparts(x.id).d} · ${COURSES[x.course].short}</button>`).join("")}</div>`;
  let head="", rows="";
  if(isFinal){
    const L=liveFor(d.id); let ptsA=0, ptsB=0, projA=0, projB=0;
    rows = matches.map((m,i)=>{ const st=matchState(L.m[i].holes||[]);

// ---------- Scores individuels (brut / net / stableford / stroke) ----------
function playerHcp(p){ const v=parseFloat(String((S.profiles[p.id]||{}).hcp||"").replace(",",".")); return isNaN(v)?null:v; }
function playingHcp(p,d){ const h=playerHcp(p); if(h===null) return 0; if(!d||!CARDS[d.course]) return Math.round(h); const r=ratingFor(d.course,playerTee(d,p.id)); if(!r) return Math.round(h); const par=CARDS[d.course].par.reduce((a,b)=>a+b,0); return Math.round(h*r.slope/113 + (r.cr-par)); }
function strokesOnHole(ph, si){ // coups reçus sur un trou selon l'index
  if(ph>=0){ const base=Math.floor(ph/18), extra=ph%18; return base + (si<=extra?1:0); }
  const give=-ph; const base=Math.floor(give/18), extra=give%18; return -(base + (si>18-extra?1:0)); }
function scoreKey(dayId,pid){ return dayId+"_"+pid; }
function holesOf(dayId,pid){ const s=S.scores[scoreKey(dayId,pid)]; const h=(s&&s.holes)||[]; return Array.from({length:18},(_,i)=>(h[i]==null||h[i]===""?null:+h[i])); }
function computeScore(d,p){ const card=CARDS[d.course]; const holes=holesOf(d.id,p.id); const ph=playingHcp(p,d); let gross=0,net=0,stb=0,par=0,n=0;
  holes.forEach((g,i)=>{ if(g==null) return; const pr=card.par[i], rec=strokesOnHole(ph,card.si[i]); n++; gross+=g; par+=pr; net+=g-rec; stb+=Math.max(0, 2+pr+rec-g); });
  return {holes,gross,net,stb,par,n,ph,toParGross:gross-par,toParNet:net-par,complete:n===18,hcpMissing:playerHcp(p)===null}; }
function fmtToPar(v){ return v===0?"E":(v>0?"+"+v:String(v)); }
function lastGolfDay(){ const gd=golfDays(); return gd.length?gd[gd.length-1].id:""; }
function rankingCard(d){
  const gd=golfDays(); const ps=S.players.slice().sort((a,b)=>a.order-b.order); const mode=S.rankMode, scope=S.rankScope;
  let rows=[];
  if(scope==="day"){ rows=ps.map(p=>({p,...computeScore(d,p)})).filter(r=>r.n>0); }
  else { rows=ps.map(p=>{ let gross=0,net=0,stb=0,par=0,days=0,n=0,ph=playingHcp(p,d); for(const dd of gd){ if(!CARDS[dd.course]) continue; const r=computeScore(dd,p); if(r.n){ gross+=r.gross; net+=r.net; stb+=r.stb; par+=r.par; n+=r.n; days++; } } return {p,gross,net,stb,par,n,days,ph,toParGross:gross-par,toParNet:net-par,complete:true,hcpMissing:playerHcp(p)===null}; }).filter(r=>r.n>0); }
  const val=r=> mode==="gross"?r.toParGross:mode==="net"?r.toParNet:-r.stb;
  rows.sort((a,b)=> val(a)-val(b) || a.n-b.n);
  const label=r=> mode==="gross"?`${r.gross} <small class="muted">(${fmtToPar(r.toParGross)})</small>`:mode==="net"?`${r.net} <small class="muted">(${fmtToPar(r.toParNet)})</small>`:`${r.stb} <small class="muted">pts</small>`;
  const thru=r=> scope==="day" ? (r.complete?"18 trous":"thru "+r.n) : (r.days+" j · "+r.n+" trous");
  const p0=dparts(d.id);
  const html=`<div class="card" id="rankCard">
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Classement individuel</div><h2>${scope==="day"?esc(COURSES[d.course].short)+" · "+p0.dow+" "+p0.d:"Semaine"}</h2></div>
      <div class="seg" style="min-width:150px"><button data-scope="day" aria-pressed="${scope==="day"}">Journée</button><button data-scope="week" aria-pressed="${scope==="week"}">Semaine</button></div></div>
    <div class="chips">${[["stableford","Stableford"],["gross","Brut"],["net","Net"]].map(([k,l])=>`<button class="chip" data-mode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>
    ${rows.length?`<div class="rank">${rows.map((r,i)=>`<span class="pos ${i<3?"top":""}">${i+1}</span><span class="nm"><b>${esc(r.p.nick)}</b><small>hcp ${r.hcpMissing?"<i>manquant</i>":playerHcp(r.p)}${scope==="day"?" · joue "+r.ph:""}</small></span><span class="val num">${label(r)}</span><span class="thru">${thru(r)}</span>`).join("")}</div>`:`<p class="muted">Aucun score saisi${scope==="day"?" pour cette journée":""}.</p>`}
    <p class="muted small">${mode==="stableford"?"Stableford : points par trou (par net = 2 pts, birdie net = 3…), coups reçus selon l'index du trou et le handicap de jeu.":mode==="net"?"Net = coups bruts moins les coups reçus trou par trou. Classé par rapport au par.":"Brut = total des coups, sans handicap. Classé par rapport au par."}</p>
  </div>`;
  return html;
}

      <p class="muted small">Un trou se verrouille dès que le suivant est saisi. Pour corriger, appuie sur ✎ à droite du trou.</p><div class="grid2"><button class="btn ghost" id="fillPar">Pré-remplir les trous vides au par</button><button class="btn ghost" id="clearScore">Effacer toute la carte</button></div>`);

// ---------- Pronos (podium du jour) ----------
const PODIUM_PTS = {exact:3, inPodium:1, bonusOrder:3}; // place exacte 3 pts, dans le podium mais mauvaise place 1 pt, podium complet dans l'ordre +3 → max 12
function pronoKey(dayId,pid){ return dayId+"_"+pid; }
function podiumOf(dayId,pid){ const o=S.pronos[pronoKey(dayId,pid)]; const a=(o&&o.podium)||[]; return [a[0]||"",a[1]||"",a[2]||""]; }
function firstTee(d){ const m=(d.teeTime||"").match(/(\d{1,2})\s*[h:]\s*(\d{2})?/); return m?{h:+m[1],m:+(m[2]||0)}:null; }
function nowSA(){ const s=new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Johannesburg",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()); const g=k=>s.find(x=>x.type===k).value; return {id:g("year")+"-"+g("month")+"-"+g("day"), min:+g("hour")*60+ +g("minute")}; }
function pronoLocked(d){ if(dayDone(d)) return {locked:true,why:"Journée terminée : podiums figés."}; const ft=firstTee(d); const n=nowSA(); if(n.id>d.id) return {locked:true,why:"Pronos fermés (départ passé)."}; if(n.id===d.id && ft && n.min>=ft.h*60+ft.m) return {locked:true,why:`Pronos fermés depuis le départ de ${ft.h}h${String(ft.m).padStart(2,"0")}.`}; return {locked:false,why:ft?`Pronos ouverts jusqu'au premier départ (${ft.h}h${String(ft.m).padStart(2,"0")}).`:"Pronos ouverts jusqu'au départ."}; }
function dayDone(d){ const ps=S.players.filter(p=>p.team); if(!ps.length) return false; return ps.every(p=>computeScore(d,p).complete); }
function actualRanks(d){ // rang réel Stableford avec ex æquo : {pid:[rangMin,rangMax]}
  const rows=S.players.map(p=>({p,r:computeScore(d,p)})).filter(x=>x.r.n>0); const ranks={};
  rows.forEach(x=>{ const higher=rows.filter(y=>y.r.stb>x.r.stb).length; const tied=rows.filter(y=>y.r.stb===x.r.stb).length; ranks[x.p.id]=[higher+1,higher+tied]; });
  return {ranks,any:rows.length>0};
}
function podiumPoints(podium,ranks){ let pts=0,exact=0,inp=0; const detail=[];
  podium.forEach((pid,i)=>{ const rg=ranks[pid]; let st="miss"; if(rg){ if(rg[0]<=i+1 && i+1<=rg[1]){ pts+=PODIUM_PTS.exact; exact++; st="exact"; } else if(rg[0]<=3){ pts+=PODIUM_PTS.inPodium; inp++; st="in"; } } detail.push(st); });
  if(exact===3) pts+=PODIUM_PTS.bonusOrder; return {pts,exact,inp,detail}; }
function pronoScores(d){ const {ranks,any}=actualRanks(d); const ps=S.players.slice().sort((a,b)=>a.order-b.order);
  const rows=ps.map(p=>{ const pod=podiumOf(d.id,p.id); if(!pod.some(Boolean)) return null; const r=any?podiumPoints(pod,ranks):{pts:0,exact:0,inp:0,detail:["","",""]}; return {p,pod,...r,complete:pod.every(Boolean)}; }).filter(Boolean);
  rows.sort((a,b)=>b.pts-a.pts||b.exact-a.exact||a.p.order-b.p.order); let rank=0; rows.forEach((r,i)=>{ if(i===0||r.pts!==rows[i-1].pts||r.exact!==rows[i-1].exact) rank=i+1; r.rank=rank; });
  return {rows,done:dayDone(d),any,ranks}; }
function playerForm(d){ // moyenne Stableford des journées déjà terminées avant d (et de d elle-même si terminée)
  const out={}; S.players.forEach(p=>{ let s=0,n=0; for(const dd of golfDays()){ if(dd.id>d.id || !CARDS[dd.course]) continue; const r=computeScore(dd,p); if(r.complete){ s+=r.stb; n++; } } out[p.id]=n?{avg:s/n,n}:null; }); return out; }
function pronoOdds(d){ const w=[3,2,1]; const votes={}; let n=0,sum=0; S.players.forEach(p=>votes[p.id]=0);
  S.players.forEach(p=>{ const pod=podiumOf(d.id,p.id); if(!pod.some(Boolean)) return; n++; pod.forEach((pid,i)=>{ if(pid && votes[pid]!=null){ votes[pid]+=w[i]; sum+=w[i]; } }); });
  const form=playerForm(d); const played=Object.values(form).filter(Boolean); const hasForm=played.length>0;
  // force "forme" : écart à la moyenne du groupe, transformé en poids (2 pts Stableford d'écart ≈ ×1,25)
  let fw={}, fsum=0; if(hasForm){ const mean=played.reduce((a,x)=>a+x.avg,0)/played.length; S.players.forEach(p=>{ const f=form[p.id]; fw[p.id]=Math.pow(1.12,(f?f.avg:mean)-mean); fsum+=fw[p.id]; }); }
  const rows=S.players.map(p=>{ const vs=sum?votes[p.id]/sum:0; const fs=hasForm?fw[p.id]/fsum:0; let share; if(sum&&hasForm) share=0.5*vs+0.5*fs; else if(sum) share=vs; else share=fs;
    const cote = share>0 ? Math.max(1.1, Math.round((1/share)*10)/10) : null; return {p,share,cote,votes:vs,form:form[p.id]}; }).sort((a,b)=>b.share-a.share||a.p.order-b.p.order);
  return {rows,n,hasForm,hasVotes:sum>0}; }
function oddsCard(d){ const {rows,n,hasForm,hasVotes}=pronoOdds(d); if(!hasVotes&&!hasForm) return `<div class="card"><div class="eyebrow">Cotes du jour</div><p class="muted">Les cotes apparaîtront dès les premiers podiums déposés.</p></div>`;
  const fmt=c=>c==null?"—":String(c).replace(".",",");
  return `<div class="card"><div class="eyebrow">Cotes du jour · ${n} podium${n>1?"s":""} déposé${n>1?"s":""}</div>
    <div class="rank">${rows.map((x,i)=>`<span class="pos ${i<3&&x.cote?"top":""}">${x.cote?i+1:""}</span><span class="nm"><b>${esc(x.p.nick)}</b><small>${x.cote?(i===0?"favori · ":"")+[hasVotes?Math.round(x.votes*100)+" % des voix":"",x.form?"forme "+Math.round(x.form.avg)+" pts":hasForm?"pas encore joué":""].filter(Boolean).join(" · "):"aucune voix… l'outsider"}</small></span><span class="val num">${fmt(x.cote)}</span><span class="thru">${x.cote?"cote":""}</span>`).join("")}</div>
    <p class="muted small">Cote = moitié podiums déposés (1er = 3 voix, 2e = 2, 3e = 1, sans dire qui a voté quoi), moitié forme (moyenne Stableford des journées jouées). Plus la cote est basse, plus c'est le favori.</p></div>`; }

function computeBalances(){
  const bal={}; S.players.forEach(p=>bal[p.id]=0);
  let total=0;
  for(const e of S.expenses){ const parts=(e.for||[]).filter(id=>bal[id]!==undefined); if(!parts.length) continue; const amt=e.mur||0; total+=amt; if(bal[e.payer]!==undefined) bal[e.payer]+=amt; const share=amt/parts.length; parts.forEach(id=>bal[id]-=share); }
  return {bal,total};
}
function settlements(bal){
  const debt=[],cred=[]; for(const [id,v] of Object.entries(bal)){ if(v<-1) debt.push({id,v:-v}); else if(v>1) cred.push({id,v}); }
  debt.sort((a,b)=>b.v-a.v); cred.sort((a,b)=>b.v-a.v); const out=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){ const m=Math.min(debt[i].v,cred[j].v); out.push({from:debt[i].id,to:cred[j].id,amt:m}); debt[i].v-=m; cred[j].v-=m; if(debt[i].v<1)i++; if(cred[j].v<1)j++; }
  return out;
}

function shrink(file,max){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("canvas")),"image/jpeg",.72); }; img.onerror=rej; img.src=url; }); }

      ${CARDS[d.course]?`<div class="field"><label>Départs joués</label><div class="chips">${Object.keys(CARDS[d.course].tees).map(tee=>`<button class="chip" data-tee="${tee}" aria-pressed="${dayTee(d)===tee}">${TEE_FR[tee]||tee}${ratingFor(d.course,tee)?" · "+ratingFor(d.course,tee).cr+"/"+ratingFor(d.course,tee).slope:""}</button>`).join("")}</div></div>`:""}
      <div class="field"><label>Note du jour (visible par tous)</label><input data-f="note" value="${esc(d.note||"")}" placeholder="ex. voiturettes réservées, départ villa 7h15"></div>
      ${COURSES[d.course]?`<div class="field"><label>Parties (2 ${esc(c.teamA.name)} contre 2 ${esc(c.teamB.name)})</label>
        ${(()=>{ const used=new Set(); (d.matches||[]).forEach(m=>[...(m?.a||[]),...(m?.b||[])].forEach(x=>{ if(x) used.add(x); }));
          return [0,1,2].map(i=>{ const m=(d.matches||[])[i]||{a:["",""],b:["",""]}; const opt=(team,v)=>`<option value="">—</option>`+teamOf(team).filter(p=>p.id===v||!used.has(p.id)).map(p=>`<option value="${p.id}" ${p.id===v?"selected":""}>${esc(p.nick)}</option>`).join("");
          return `<div class="adm-match"><select data-m="${i}" data-side="a" data-k="0">${opt("A",m.a?.[0])}</select><select data-m="${i}" data-side="a" data-k="1">${opt("A",m.a?.[1])}</select><span class="muted small">vs</span><select data-m="${i}" data-side="b" data-k="0">${opt("B",m.b?.[0])}</select><select data-m="${i}" data-side="b" data-k="1">${opt("B",m.b?.[1])}</select></div>`; }).join(""); })()}
        <button class="btn sm ghost" data-shufflematches="1" style="justify-self:start">Tirer les parties au sort</button></div>
      <div class="seg"><button class="A" data-r="A" aria-pressed="${d.result==="A"}">${esc(c.teamA.name)}</button><button class="draw" data-r="draw" aria-pressed="${d.result==="draw"}">Égalité</button><button class="B" data-r="B" aria-pressed="${d.result==="B"}">${esc(c.teamB.name)}</button><button data-r="" aria-pressed="${!d.result}">${(()=>{const s=daySummary(d); return s&&s.done?"Auto (Live "+fmtPts(s.a)+"–"+fmtPts(s.b)+")":"À jouer";})()}</button></div>`:""}
      ${S.photos[d.id]?`<button class="btn sm ghost" data-rmphoto="${d.id}">Retirer la photo du jour</button>`:""}
    </div>`;}).join("")}
  </div>
  <div class="card"><div class="eyebrow">Pronos (secrets) · podiums déposés</div>
    ${golfDays().map(d=>{ const rows=ps.map(q=>({q,pod:podiumOf(d.id,q.id)})).filter(x=>x.pod.some(Boolean)); if(!rows.length) return ""; const p=dparts(d.id); return `<div class="field"><label>${p.dow} ${p.d} · ${esc(COURSES[d.course].short)} · ${rows.length}/${ps.length}</label>${rows.map(x=>`<div class="small" style="padding:3px 0;border-bottom:1px solid var(--line)"><b>${esc(x.q.nick)}</b> → ${x.pod.map((pid,i)=>pid?["🥇","🥈","🥉"][i]+" "+esc(playerById(pid)?.nick||"?"):"").filter(Boolean).join(" · ")}</div>`).join("")}</div>`; }).join("")||`<p class="muted small">Aucun podium déposé pour l'instant.</p>`}
  </div>
  <div class="card"><div class="eyebrow">Slope & course rating (hommes) · handicap de parcours = index × slope / 113 + (rating − par)</div>
    ${Object.keys(CARDS).map(k=>`<div class="field"><label>${esc(COURSES[k].short)} · par ${CARDS[k].par.reduce((a,b)=>a+b,0)}</label>${Object.keys(CARDS[k].tees).map(tee=>{ const r=ratingFor(k,tee); return `<div class="grid2" style="grid-template-columns:80px 1fr 1fr;align-items:center;margin-bottom:4px"><span class="small">${TEE_FR[tee]||tee}</span><input data-rt="${k}.${tee}.0" inputmode="decimal" value="${r?r.cr:""}" placeholder="rating"><input data-rt="${k}.${tee}.1" inputmode="numeric" value="${r?r.slope:""}" placeholder="slope"></div>`; }).join("")}</div>`).join("")}
    <p class="muted small">Pré-rempli : Simola et Goose Valley (valeurs 2026), Pezula / Plettenberg / Knysna GC (feuille GolfRSA 2018). Corrige avec la carte du club si besoin.</p>
  </div>
  <div class="card"><div class="eyebrow">Vols</div>
    ${[["out1","Aller 1"],["out2","Aller 2"],["ret1","Retour 1"],["ret2","Retour 2"]].map(([k,l])=>`<div class="field"><label>${l} · ${esc(c[k].from)} → ${esc(c[k].to)}</label><div class="grid2" style="grid-template-columns:1fr 1fr 1fr"><input data-fl="${k}" data-f="no" value="${esc(c[k].no)}" placeholder="N° vol"><input data-fl="${k}" data-f="dep" value="${esc(c[k].dep)}" placeholder="Départ"><input data-fl="${k}" data-f="arr" value="${esc(c[k].arr)}" placeholder="Arrivée"></div></div>`).join("")}
    <div class="field"><label for="shuttle">Navette Maurice</label><textarea id="shuttle" rows="3">${esc(c.shuttle)}</textarea></div>
  </div>
  <div class="card"><div class="eyebrow">Villa & messages</div>
    <div class="field"><label for="villaArrival">Arrivée à la villa</label><input id="villaArrival" value="${esc(c.villaArrival)}"></div>
    <div class="field"><label for="villaNotes">Notes villa</label><input id="villaNotes" value="${esc(c.villaNotes)}"></div>
    <div class="field"><label for="dress">Dress code (accueil)</label><input id="dress" value="${esc(c.dress)}"></div>
    <div class="field"><label for="welcome">Message du jour (accueil, laisser vide pour masquer)</label><textarea id="welcome" rows="2">${esc(c.welcome||"")}</textarea></div>
    <div class="field"><label for="format">Formule de jeu (affichée dans Classement)</label><textarea id="format" rows="4">${esc(c.format||"")}</textarea></div>
    <div class="field"><label for="squabbit">Lien du tournoi Squabbit</label><input id="squabbit" value="${esc(c.squabbit||"")}"></div>
    <div class="field"><label for="rate">Taux de change : 1 rand = … roupies</label><input id="rate" type="number" step="0.01" value="${c.rate}"></div>
  </div>
  <div class="card"><div class="eyebrow">Joueurs</div>${ps.map(p=>`<div class="grid2" style="grid-template-columns:1fr 1fr 1fr;align-items:end"><div class="field"><label>Surnom</label><input data-pl="${p.id}" data-f="nick" value="${esc(p.nick)}"></div><div class="field"><label>Nom</label><input data-pl="${p.id}" data-f="name" value="${esc(p.name)}"></div><div class="field"><label>Téléphone</label><input data-pl="${p.id}" data-f="phone" value="${esc(p.phone||"")}"></div></div>`).join("")}</div>`;

  const root=$("#p-admin");
  root.querySelectorAll("[data-allow]").forEach(b=>b.onclick=async()=>{ try{ await S.db.doc("config/admins").set({uids:firebase.firestore.FieldValue.arrayUnion(b.dataset.allow)},{merge:true}); await S.db.doc("adminRequests/"+b.dataset.allow).delete(); toast("Appareil autorisé"); }catch(e){ console.error(e); toast("Refusé par la base"); } });
  root.querySelectorAll("[data-deny]").forEach(b=>b.onclick=async()=>{ try{ await S.db.doc("adminRequests/"+b.dataset.deny).delete(); }catch(e){ console.error(e); } });
  const rv=$("#revokeAll"); if(rv) rv.onclick=()=>confirmSheet("Retirer l'accès organisateur à tous les appareils autorisés ? (ton compte Google reste organisateur)",async()=>{ await S.db.doc("config/admins").set({uids:[]}); toast("Accès révoqués"); });
  const cfgSave = debounce(()=>save("config/main",S.cfg),600);
  const setCfg=(path,v)=>{ const ks=path.split("."); let o=S.cfg; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks.at(-1)]=v; cfgSave(); };
  $("#tA").oninput=e=>setCfg("teamA.name",e.target.value); $("#tB").oninput=e=>setCfg("teamB.name",e.target.value);
  ["shuttle","villaArrival","villaNotes","dress","welcome","format","squabbit"].forEach(id=>$("#"+id).oninput=e=>setCfg(id,e.target.value));
  $("#rate").oninput=e=>{ const v=parseFloat(e.target.value); if(v>0) setCfg("rate",v); };
  root.querySelectorAll("[data-fl]").forEach(i=>i.oninput=e=>setCfg(i.dataset.fl+"."+i.dataset.f,e.target.value));
  root.querySelectorAll("[data-rt]").forEach(i=>i.oninput=e=>{ const [k,tee,idx]=i.dataset.rt.split("."); S.cfg.ratings=S.cfg.ratings||{}; S.cfg.ratings[k]=S.cfg.ratings[k]||{}; const cur=S.cfg.ratings[k][tee]||(RATINGS[k]||{})[tee]||["",""]; const v=[...cur]; v[+idx]=e.target.value.replace(",","."); S.cfg.ratings[k][tee]=v; cfgSave(); });
  root.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{ const p=playerById(b.dataset.team); const n=p.team===""?"A":p.team==="A"?"B":""; p.team=n; save("players/"+p.id,{...p}); renderAdmin(); });
  async function clearMatchesAndLive(){ for(const d of S.days){ if((d.matches||[]).length){ d.matches=[]; await save("days/"+d.id,{...d}); } if(S.live[d.id]){ try{ await S.db.doc("live/"+d.id).delete(); }catch(e){} } } }
  $("#shuffle").onclick=()=>confirmSheet("Tirer les équipes au sort (6 / 6) ? Les parties et les scores Live seront remis à zéro.",async()=>{ const ids=ps.map(p=>p.id).sort(()=>Math.random()-.5); for(const p of ps){ p.team = ids.indexOf(p.id)<6?"A":"B"; await save("players/"+p.id,{...p}); } await clearMatchesAndLive(); renderAdmin(); });
  $("#clearTeams").onclick=()=>confirmSheet("Vider les deux équipes ? Les parties et les scores Live seront aussi effacés.",async()=>{ for(const p of ps){ p.team=""; await save("players/"+p.id,{...p}); } await clearMatchesAndLive(); renderAdmin(); });
  root.querySelectorAll(".adm-day").forEach(el=>{ const d=S.days.find(x=>x.id===el.dataset.day); const ds=debounce(()=>save("days/"+d.id,{...d}),500);
    el.querySelectorAll("[data-f]").forEach(i=>i.oninput=e=>{ d[i.dataset.f]=e.target.value; if(i.dataset.f==="course"){ save("days/"+d.id,{...d}); renderAdmin(); } else ds(); });
    el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ d.result=b.dataset.r; save("days/"+d.id,{...d}); renderAdmin(); });
    el.querySelectorAll("[data-tee]").forEach(b=>b.onclick=()=>{ d.tee=b.dataset.tee; save("days/"+d.id,{...d}); renderAdmin(); });
    el.querySelectorAll("select[data-m]").forEach(s=>s.onchange=()=>{ const ms=[0,1,2].map(i=>(d.matches||[])[i]||{a:["",""],b:["",""]}); const m=ms[+s.dataset.m]; m[s.dataset.side]=[...(m[s.dataset.side]||["",""])]; m[s.dataset.side][+s.dataset.k]=s.value; d.matches=ms; save("days/"+d.id,{...d}); renderAdmin(); const el2=document.querySelector(`.adm-day[data-day="${d.id}"]`); if(el2) el2.scrollIntoView({block:"nearest"}); });
    el.querySelectorAll("[data-shufflematches]").forEach(b=>b.onclick=()=>{ const r=smartDraw(d.id); if(!r) return toast("Il faut 6 joueurs par équipe"); d.matches=r; save("days/"+d.id,{...d}); renderAdmin(); toast("Parties tirées : chacun joue avec un maximum de copains différents"); });
    el.querySelectorAll("[data-rmphoto]").forEach(b=>b.onclick=()=>confirmSheet("Retirer la photo de cette journée ?",async()=>{ await S.db.doc("photos/"+d.id).delete(); toast("Photo retirée"); })); });
  const plSave={}; root.querySelectorAll("[data-pl]").forEach(i=>i.oninput=e=>{ const p=playerById(i.dataset.pl); p[i.dataset.f]=e.target.value; (plSave[p.id]||(plSave[p.id]=debounce(()=>save("players/"+p.id,{...p}),600)))(); });
}

// ---------- Démarrage ----------
try{ const t=localStorage.getItem("jm.tab"); if(t && TABS.some(x=>x[0]===t)) S.tab=t; }catch{}
const h=location.hash.replace("#",""); if(TABS.some(x=>x[0]===h)) S.tab=h;
document.querySelectorAll('section[role="tabpanel"]').forEach(s=>s.hidden = s.id!=="p-"+S.tab);
renderTabs(); render();

const FIREBASE_CONFIG = { apiKey: "AIzaSyAzrH_Ow0DeBbkAziHgMVJe3Vpfg1v51gg", authDomain: "jambon-masters.firebaseapp.com", projectId: "jambon-masters", storageBucket: "jambon-masters.firebasestorage.app", messagingSenderId: "215172939926", appId: "1:215172939926:web:960cfa852e7df78fb4c2b7" };
const ADMIN_EMAIL = "laubertiestephane@gmail.com";
let subsStarted=false;
function isStandalone(){ try{ return !!(navigator.standalone || matchMedia("(display-mode: standalone)").matches); }catch(e){ return false; } }
async function requestAdminAccess(){
  if(!S.db || !S.uid) return toast("Pas encore connecté à la base, réessaie dans quelques secondes");
  try{
    await S.db.doc("adminRequests/"+S.uid).set({name:S.me||"", device:(navigator.userAgent.match(/iPhone|iPad|Android|Macintosh|Windows/)||["Appareil"])[0], ts:Date.now()});
    sheet(`<h3>Demande envoyée !</h3><p>Ouvre l'app sur ton Mac, onglet <b>Réglages</b>, et appuie sur <b>Autoriser</b> pour cet appareil. Cette page se débloquera toute seule.</p><button class="btn primary" data-close>OK</button>`);
  }catch(e){ console.error("request",e); toast("Demande impossible ("+(e.code||"?")+")"); }
}
async function adminLogin(){
  if(!window.firebase) return toast("Connexion indisponible");
  if(isStandalone()) return requestAdminAccess();
  const auth=firebase.auth(), p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account", login_hint:ADMIN_EMAIL});
  try{ await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  try{ await auth.signInWithPopup(p); }
  catch(e){ console.error("login",e);
    if(e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request") requestAdminAccess();
  }
}
let reqSubStarted=false;
function recomputeOwner(){
  const u=window.firebase ? firebase.auth().currentUser : null;
  const was=S.isOwner;
  S.isOwner = !!u && ((u.email||"").toLowerCase()===ADMIN_EMAIL || (S.admins||[]).includes(u.uid));
  if(S.isOwner && !was){ toast("Bonjour l'organisateur !"); if(S.db){ seedIfEmpty(S.db); if(!reqSubStarted){ reqSubStarted=true; S.db.collection("adminRequests").onSnapshot(s=>{ S.adminRequests=s.docs.map(x=>({...x.data(), id:x.id})); if(S.tab==="admin") renderAdmin(); }, e=>console.warn("req",e)); } } }
  if(S.isOwner!==was){ renderTabs(); render(); }
}
function startSubs(db){ if(subsStarted) return; subsStarted=true;
  const sub=(ref,fn)=>ref.onSnapshot(s=>{fn(s); S.dbReady=true; if(S.tab!=="admin") render();}, e=>console.warn("db",e));
  sub(db.doc("config/main"), s=>{ if(s.exists){ const d=s.data(); S.cfg={...DEFAULT_CFG,...d, teamA:{...DEFAULT_CFG.teamA,...(d.teamA||{})}, teamB:{...DEFAULT_CFG.teamB,...(d.teamB||{})}}; ["out1","out2","ret1","ret2"].forEach(k=>S.cfg[k]={...DEFAULT_CFG[k],...(d[k]||{})}); } });
  sub(db.doc("config/main"), s=>{ if(!S.fx.live && S.cfg.rate>0) S.fx.rate=S.cfg.rate; });
  sub(db.doc("config/settled"), s=>{ S.settled = s.exists? {...s.data()} : {}; });
  sub(db.doc("config/admins"), s=>{ S.admins = s.exists ? (s.data().uids||[]) : []; recomputeOwner(); });
  const NICK_FIX={tens:"El Padré"}; // demandé par Brad le 31/10 (ex-« Tens »)
  sub(db.collection("players"), s=>{ if(!s.empty){ S.players = s.docs.map(x=>({team:"",order:0,...x.data(), id:x.id})); S.players.forEach(p=>{ if(NICK_FIX[p.id] && p.nick!==NICK_FIX[p.id]){ p.nick=NICK_FIX[p.id]; if(S.isOwner) S.db.doc("players/"+p.id).set({...p}).catch(()=>{}); } }); } });
  sub(db.collection("days"), s=>{ if(!s.empty){ const m={}; s.docs.forEach(x=>m[x.id]={...x.data(), id:x.id}); S.days = S.days.map(d=>m[d.id]?{...d,...m[d.id]}:d); } });
  sub(db.collection("photos"), s=>{ S.photos={}; s.docs.forEach(x=>S.photos[x.id]=x.data()); });
  sub(db.collection("profiles"), s=>{ S.profiles={}; s.docs.forEach(x=>S.profiles[x.id]=x.data()); });
  sub(db.collection("expenses"), s=>{ S.expenses = s.docs.map(x=>({...x.data(), id:x.id})); });
  sub(db.collection("wall"), s=>{ S.wall = s.docs.map(x=>({...x.data(), id:x.id})); });
  sub(db.collection("live"), s=>{ S.live={}; S.scores={}; S.pronos={}; s.docs.forEach(x=>{ if(x.id.startsWith("score_")){ S.scores[x.id.slice(6)]=x.data(); } else if(x.id.startsWith("prono_")){ S.pronos[x.id.slice(6)]=x.data(); } else S.live[x.id]=x.data(); }); if(scoreSheet && scoreSheet.redraw && $("#sheet")) scoreSheet.redraw(); if((S.tab==="live"||S.tab==="pronos") && !$("#sheet")) render(); if(liveSheet && liveSheet.redraw && $("#sheet")) liveSheet.redraw(); });
}
async function seedIfEmpty(db){
  try{ const ps=await db.collection("players").get(); if(!ps.empty) return;
    const batch=db.batch();
    batch.set(db.doc("config/main"), DEFAULT_CFG);
    DEFAULT_PLAYERS.forEach(p=>{ const {id,...d}=p; batch.set(db.doc("players/"+id), d); });
    DEFAULT_DAYS.forEach(d=>{ const {id,...x}=d; batch.set(db.doc("days/"+id), x); });
    await batch.commit(); toast("Données initiales enregistrées");
  }catch(e){ console.error("seed",e); }
}
// Mise à jour automatique : on compare la version publiée à celle chargée.
const BUILD="20261031-211123";
async function checkUpdate(){ try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); const j=await r.json(); if(j.build && j.build!==BUILD){ toast("Nouvelle version de l'app…"); setTimeout(()=>location.reload(),900); } }catch(e){} }
setInterval(checkUpdate, 3*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkUpdate(); });
setTimeout(checkUpdate, 4000);
loadFx();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
(function boot(){
  if(!window.firebase){ S.dbReady=true; render(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.firestore(); S.db=db;
    try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
    startSubs(db);
    const auth=firebase.auth();
    auth.getRedirectResult().catch(e=>console.warn("redirect",e));
    auth.onAuthStateChanged(u=>{
      if(!u){ auth.signInAnonymously().catch(e=>{ console.error(e); S.canWrite=false; render(); }); return; }
      S.uid=u.uid; S.canWrite=true;
      recomputeOwner();
      if(!S.isOwner && u.email){ toast("Connecté avec "+u.email+" : ce n'est pas le compte organisateur"); }
      renderTabs(); render();
    });
  }catch(e){ console.error(e); S.dbReady=true; render(); }
})();
</script>
